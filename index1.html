<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fish Feed Formulation Software</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#eef5f7;
}

header{
    background:#00796B;
    color:white;
    padding:20px;
    text-align:center;
}

.container{
    width:90%;
    max-width:1000px;
    margin:30px auto;
}

.card{
    background:white;
    padding:20px;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
}

table th{
    background:#00796B;
    color:white;
    padding:10px;
}

table td{
    padding:10px;
    text-align:center;
    border:1px solid #ddd;
}

input{
    width:80px;
    padding:5px;
}

button{
    margin-top:20px;
    background:#00796B;
    color:white;
    border:none;
    padding:12px 25px;
    border-radius:5px;
    cursor:pointer;
}

button:hover{
    background:#004D40;
}

.result{
    margin-top:30px;
    background:#E8F5E9;
    padding:20px;
    border-radius:10px;
}

</style>

</head>

<body>

<header>

<h1>Fish Feed Formulation Software</h1>

<p>Aquaculture Nutrition Calculator</p>

</header>

<div class="container">

<div class="card">

<h2>Ingredient Input</h2>

<table>

<tr>

<th>Ingredient</th>

<th>Weight (kg)</th>

<th>Protein (%)</th>

</tr>

<tr>

<td>Fish Meal</td>

<td><input type="number" id="fishmeal"></td>

<td>60</td>

</tr>

<tr>

<td>Soybean Meal</td>

<td><input type="number" id="soybean"></td>

<td>44</td>

</tr>

<tr>

<td>Maize Bran</td>

<td><input type="number" id="maize"></td>

<td>10</td>

</tr>

<tr>

<td>Wheat Bran</td>

<td><input type="number" id="wheat"></td>

<td>15</td>

</tr>

</table>

<button onclick="calculateFeed()">Calculate Feed</button>

<div class="result">

<h2>Results</h2>

<p id="total"></p>

<p id="protein"></p>

</div>

</div>

</div>

<script>

function calculateFeed(){

let fm=Number(document.getElementById("fishmeal").value);

let sb=Number(document.getElementById("soybean").value);

let mb=Number(document.getElementById("maize").value);

let wb=Number(document.getElementById("wheat").value);

let total=fm+sb+mb+wb;

if(total==0){

alert("Please enter ingredient weights.");

return;

}

let cp=((fm*60)+(sb*44)+(mb*10)+(wb*15))/total;

document.getElementById("total").innerHTML=
"<b>Total Feed:</b> "+total.toFixed(2)+" kg";

document.getElementById("protein").innerHTML=
"<b>Crude Protein:</b> "+cp.toFixed(2)+" %";

}

</script>

</body>

</html>
